services:
  bot:
    image: dtek-bot:latest
    container_name: dtek-bot
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /config.toml
    volumes:
      - ./data:/data
      - ./config.toml:/config.toml:ro
    user: "1000:1000"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
