[package]
name = "dtek-power-off-bot"
version = "0.1.0"
edition = "2024"
description = "Telegram bot that posts DTEK power outage schedules to a channel"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "macros", "time", "signal"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt", "macros", "time", "signal", "rt-multi-thread", "test-util"] }
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
